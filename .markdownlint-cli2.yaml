# Config for markdownlint-cli2, run by the pre-commit hook in
# .pre-commit-config.yaml. Rule IDs (MD001 and so on) are listed at
# https://github.com/DavidAnson/markdownlint/blob/main/doc/Rules.md
# To turn a rule off, add "MDxxx: false" under config: below.

# Pelican metadata (Title:, license: and so on) is not Markdown.
frontMatter: "^(?:[A-Za-z][\\w-]*:.*\\r?\\n)+"

ignores:
  - "content/theme/**"

config:
  # Site conventions: long single-line paragraphs, inline HTML, and the
  # page title coming from the Title: metadata.
  MD013: false
  MD033: false
  MD041: false
  # "!" in blog headings.
  MD026:
    punctuation: ".,;:。，；："
  # Tabs are kept inside code examples.
  MD010:
    code_blocks: false
  # Authors indent lists and choose their own emphasis markers; neither
  # changes how the page renders.
  MD007: false
  MD049: false

  # Existing pages break these rules. Re-enable each one once the pages
  # are cleaned up.
  MD001: false
  MD014: false
  MD024: false
  MD025: false
  MD029: false
  MD036: false
  MD046: false
